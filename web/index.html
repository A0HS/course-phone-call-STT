<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통화 STT · 미팅 기록</title>
  <style>
    :root { color-scheme: dark; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
    body { margin: 0; background: #10131a; color: #eef2f7; }
    main { max-width: 1100px; margin: 0 auto; padding: 34px 22px 70px; }
    h1 { margin: 0 0 8px; font-size: 30px; } h2 { font-size: 19px; margin: 0 0 15px; }
    .sub, .hint, .muted { color: #9ba7b8; } .sub { margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
    .card { background: #191e28; border: 1px solid #2c3544; border-radius: 16px; padding: 20px; margin-bottom: 18px; }
    .drop { border: 1px dashed #52647c; border-radius: 12px; padding: 23px; text-align: center; background: #151a23; }
    input[type=file] { display: none; }
    button, .file-label { border: 0; border-radius: 9px; padding: 10px 14px; background: #4f7cff; color: white; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: wait; } .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .sample { background: #303d54; } #status { min-height: 24px; color: #aebbd0; margin: 16px 0 8px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 17px; color: #9ba7b8; font-size: 13px; margin-bottom: 13px; }
    .result { background: #0d1117; border-radius: 10px; padding: 13px 15px; max-height: 400px; overflow: auto; }
    .line { display: grid; grid-template-columns: 68px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid #202735; line-height: 1.5; }
    .time { color: #79a0ff; font-variant-numeric: tabular-nums; } .empty { color: #768399; text-align: center; padding: 25px 0; }
    .analysis h3 { margin: 13px 0 6px; font-size: 14px; color: #91b0ff; } .analysis p { margin: 0; line-height: 1.55; }
    ul { margin: 7px 0 0; padding-left: 20px; line-height: 1.6; } .todo-row, .meeting-row { border-top: 1px solid #2a3341; padding: 11px 0; }
    .todo-row { display: grid; grid-template-columns: 24px 1fr; gap: 9px; align-items: start; } .todo-row input { margin-top: 4px; }
    .todo-main { line-height: 1.45; } .todo-meta { color: #93a1b3; font-size: 12px; margin-top: 3px; }
    .meeting-row strong { color: #dce6f9; } .meeting-row p { margin: 4px 0 0; color: #aab6c7; line-height: 1.45; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body><main>
  <h1>통화 STT · 미팅 기록</h1>
  <p class="sub">faster-whisper large-v3-turbo · 받아쓰기와 미팅 정리를 PC에서 실행</p>
  <div class="grid">
    <div>
      <section class="card">
        <h2>새 녹음</h2>
        <div class="drop"><label class="file-label" for="audio">MP3 파일 올리기</label><input id="audio" type="file" accept="audio/*,.mp3,.m4a,.wav,.flac" /><div id="chosen" class="hint">파일을 선택하면 받아쓰기와 미팅 기록을 시작합니다.</div></div>
        <div class="hint" style="margin-top:14px">녹음 폴더의 시험 파일</div><div id="samples" class="samples"></div>
      </section>
      <section class="card"><div id="status">준비됨</div><div id="meta" class="meta"></div><div id="analysis" class="analysis"></div><h2 style="margin-top:20px">받아쓰기</h2><div id="result" class="result"><div class="empty">아직 결과가 없습니다.</div></div></section>
    </div>
    <div>
      <section class="card"><h2>To-Do</h2><div id="todos"><div class="empty">불러오는 중...</div></div></section>
      <section class="card"><h2>미팅 목록</h2><div id="meetings"><div class="empty">불러오는 중...</div></div></section>
    </div>
  </div>
</main>
<script>
const audio=document.querySelector('#audio'), chosen=document.querySelector('#chosen'), statusEl=document.querySelector('#status'), metaEl=document.querySelector('#meta'), resultEl=document.querySelector('#result'), analysisEl=document.querySelector('#analysis'), samplesEl=document.querySelector('#samples');
function busy(v){document.querySelectorAll('button').forEach(function(x){x.disabled=v});audio.disabled=v}
function renderAnalysis(a){analysisEl.innerHTML='';if(!a)return;var title=document.createElement('h3');title.textContent='거래처 · '+(a.client||'미상');analysisEl.append(title);var s=document.createElement('h3');s.textContent='요약';analysisEl.append(s);var p=document.createElement('p');p.textContent=a.summary;analysisEl.append(p);var d=document.createElement('h3');d.textContent='결정 사항';analysisEl.append(d);var ul=document.createElement('ul');(a.decisions||[]).forEach(function(x){var li=document.createElement('li');li.textContent=x;ul.append(li)});analysisEl.append(ul)}
function render(data){metaEl.innerHTML='';[['파일',data.filename],['녹음 날짜',data.recording_date],['음성 길이',data.duration?data.duration.toFixed(1)+'초':'-'],['처리 시간',data.elapsed_seconds.toFixed(2)+'초'],['실행',data.device+' / '+data.compute_type]].forEach(function(pair){var s=document.createElement('span');s.textContent=pair[0]+': '+pair[1];metaEl.append(s)});renderAnalysis(data.analysis);resultEl.innerHTML='';if(!data.segments||!data.segments.length){resultEl.innerHTML='<div class="empty">인식된 문장이 없습니다.</div>';return}data.segments.forEach(function(r){var line=document.createElement('div');line.className='line';var t=document.createElement('span');t.className='time';t.textContent=r.timestamp;var x=document.createElement('span');x.textContent=r.text;line.append(t,x);resultEl.append(line)})}
async function request(url,opt){busy(true);statusEl.textContent='받아쓰기와 미팅 기록을 처리하는 중입니다. 처음에는 모델 로딩 시간이 걸릴 수 있습니다.';var t=Date.now();try{var res=await fetch(url,opt),data=await res.json();if(!res.ok)throw Error(data.detail||'처리 중 오류');render(data);statusEl.textContent='완료 ('+((Date.now()-t)/1000).toFixed(1)+'초) · '+(data.database&&data.database.saved?'Neon 저장 완료':'화면 표시 완료');await refreshLists()}catch(e){statusEl.textContent='오류: '+e.message}finally{busy(false)}}
audio.addEventListener('change',function(){var f=audio.files[0];if(!f)return;chosen.textContent=f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB)';var form=new FormData();form.append('file',f);request('/api/transcribe-upload',{method:'POST',body:form})});
async function loadSamples(){var list=await(await fetch('/api/samples')).json();list.forEach(function(x){var b=document.createElement('button');b.className='sample';b.textContent=x.name;b.onclick=function(){request('/api/transcribe-sample',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x.name)})};samplesEl.append(b)})}
async function refreshLists(){var pair=await Promise.all([fetch('/api/todos').then(function(x){return x.json()}),fetch('/api/meetings').then(function(x){return x.json()})]),ts=pair[0],ms=pair[1],tEl=document.querySelector('#todos');tEl.innerHTML=ts.length?'':'<div class="empty">저장된 To-Do가 없습니다.</div>';ts.forEach(function(x){var row=document.createElement('div');row.className='todo-row';var c=document.createElement('input');c.type='checkbox';c.checked=x.completed;c.onchange=async function(){await fetch('/api/todos/'+x.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:c.checked})});refreshLists()};var main=document.createElement('div');main.className='todo-main';main.textContent=x.task;var meta=document.createElement('div');meta.className='todo-meta';meta.textContent='담당: '+(x.assignee||'미지정')+' · 기한: '+(x.due_date||'미정')+' · '+(x.client||x.filename);main.append(meta);row.append(c,main);tEl.append(row)});var mEl=document.querySelector('#meetings');mEl.innerHTML=ms.length?'':'<div class="empty">저장된 미팅이 없습니다.</div>';ms.forEach(function(x){var row=document.createElement('div');row.className='meeting-row';var h=document.createElement('strong');h.textContent=x.recording_date+' · '+(x.client||'거래처 미상');var p=document.createElement('p');p.textContent=x.summary;row.append(h,p);mEl.append(row)})}
loadSamples();refreshLists();
</script></body></html>
