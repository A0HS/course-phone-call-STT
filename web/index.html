<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>통화 STT · 미팅 기록</title>
<style>
:root{color-scheme:dark;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}body{margin:0;background:#10131a;color:#eef2f7}main{max-width:1100px;margin:auto;padding:30px 22px 70px}h1{margin:0 0 6px;font-size:30px}h2{font-size:19px;margin:0 0 15px}.sub,.hint,.muted{color:#9ba7b8}.sub{margin:0 0 10px}.mode{font-size:12px;color:#91b0ff;margin-bottom:22px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#191e28;border:1px solid #2c3544;border-radius:16px;padding:20px;margin-bottom:18px}.drop{border:1px dashed #52647c;border-radius:12px;padding:23px;text-align:center;background:#151a23;display:flex;flex-direction:column;align-items:center;gap:14px}input[type=file]{display:none}button,.file-label{border:0;border-radius:9px;padding:10px 14px;background:#4f7cff;color:white;cursor:pointer;font-size:14px}button:disabled{opacity:.5;cursor:wait}.samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sample{background:#303d54}#status{min-height:24px;color:#aebbd0;margin:16px 0 8px}.meta{display:flex;flex-wrap:wrap;gap:8px 17px;color:#9ba7b8;font-size:13px;margin-bottom:13px}.result{background:#0d1117;border-radius:10px;padding:13px 15px;max-height:400px;overflow:auto}.line{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #202735;line-height:1.5}.time{color:#79a0ff;font-variant-numeric:tabular-nums}.empty{color:#768399;text-align:center;padding:25px 0}.analysis h3{margin:13px 0 6px;font-size:14px;color:#91b0ff}.analysis p{margin:0;line-height:1.55}ul{margin:7px 0;padding-left:20px;line-height:1.6}.todo-row,.meeting-row{border-top:1px solid #2a3341;padding:11px 0}.todo-row{display:grid;grid-template-columns:24px 1fr;gap:9px}.todo-meta{color:#93a1b3;font-size:12px;margin-top:3px}.meeting-row strong{color:#dce6f9}.meeting-row p{margin:4px 0;color:#aab6c7;line-height:1.45}.notice{padding:10px 12px;border-radius:9px;background:#352d18;color:#f4d58a;margin:12px 0;font-size:13px}.key-row{display:flex;gap:8px;margin-bottom:12px}.key-row input{flex:1;min-width:0;background:#0d1117;border:1px solid #52647c;border-radius:8px;color:white;padding:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>통화 STT · 미팅 기록</h1><p class="sub">받아쓰기와 미팅 정리</p><div id="mode" class="mode"></div><div id="access"></div><div id="keybox"></div><div id="notice"></div>
<div class="grid"><div><section class="card"><h2>새 녹음</h2><div class="drop"><label class="file-label" for="audio">오디오 파일 올리기</label><input id="audio" type="file" accept="audio/*,.mp3,.m4a,.wav,.flac"><div id="chosen" class="hint">파일을 선택하면 처리를 시작합니다.</div></div><div class="hint" style="margin-top:14px">녹음 폴더의 시험 파일</div><div id="samples" class="samples"></div></section><section class="card"><div id="status">준비됨</div><div id="meta" class="meta"></div><div id="analysis" class="analysis"></div><h2 style="margin-top:20px">받아쓰기</h2><div id="result" class="result"><div class="empty">아직 결과가 없습니다.</div></div></section></div><div><section class="card"><h2>To-Do</h2><div id="todos"><div class="empty">불러오는 중...</div></div></section><section class="card"><h2>미팅 목록</h2><div id="meetings"><div class="empty">불러오는 중...</div></div></section></div></div></main>
<script>
const $=s=>document.querySelector(s),audio=$('#audio'),chosen=$('#chosen'),statusEl=$('#status'),metaEl=$('#meta'),resultEl=$('#result'),analysisEl=$('#analysis'),samplesEl=$('#samples');let config=null,accessCode='',apiKey='';
function headers(extra={}){const h={...extra};if(accessCode)h['X-Access-Code']=accessCode;if(apiKey&&!config.server_key_configured)h['X-OpenAI-API-Key']=apiKey;return h}
function busy(v){document.querySelectorAll('button').forEach(x=>x.disabled=v);audio.disabled=v}
function renderAnalysis(a){analysisEl.innerHTML='';if(!a)return;[['거래처',a.client||'미상'],['요약',a.summary]].forEach(([k,v])=>{let h=document.createElement('h3');h.textContent=k;analysisEl.append(h);let p=document.createElement('p');p.textContent=v;analysisEl.append(p)});let h=document.createElement('h3');h.textContent='결정 사항';analysisEl.append(h);let ul=document.createElement('ul');(a.decisions||[]).forEach(x=>{let li=document.createElement('li');li.textContent=x;ul.append(li)});analysisEl.append(ul)}
function render(d){metaEl.innerHTML='';[['파일',d.filename],['녹음 날짜',d.recording_date],['음성 길이',d.duration?Number(d.duration).toFixed(1)+'초':'-'],['처리 시간',Number(d.elapsed_seconds).toFixed(2)+'초'],['실행',d.device+' / '+d.compute_type]].forEach(([k,v])=>{let s=document.createElement('span');s.textContent=k+': '+v;metaEl.append(s)});renderAnalysis(d.analysis);resultEl.innerHTML='';if(!d.segments?.length){resultEl.innerHTML='<div class="empty">인식된 문장이 없습니다.</div>';return}d.segments.forEach(r=>{let line=document.createElement('div');line.className='line';let t=document.createElement('span');t.className='time';t.textContent=r.timestamp;let x=document.createElement('span');x.textContent=r.text;line.append(t,x);resultEl.append(line)})}
async function request(url,opt={}){busy(true);statusEl.textContent='처리 중입니다. 잠시 기다려 주세요.';let started=Date.now();try{opt.headers=headers(opt.headers||{});let res=await fetch(url,opt),d=await res.json();if(!res.ok)throw Error(d.detail||'처리 중 오류');render(d);statusEl.textContent='완료 ('+((Date.now()-started)/1000).toFixed(1)+'초) · '+(d.database?.saved?'Neon 저장 완료':'결과만 표시');await refreshLists()}catch(e){statusEl.textContent='오류: '+e.message}finally{busy(false)}}
audio.addEventListener('change',()=>{let f=audio.files[0];if(!f)return;if(config.upload_limit_bytes&&f.size>config.upload_limit_bytes){chosen.textContent='';statusEl.textContent='웹 모드에서는 4.5MB 이하 파일만 올릴 수 있습니다.';audio.value='';return}chosen.textContent=f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB)';let form=new FormData();form.append('file',f);request('/api/transcribe-upload',{method:'POST',body:form})});
async function loadSamples(){let res=await fetch('/api/samples',{headers:headers()});if(!res.ok)return;let list=await res.json();samplesEl.innerHTML='';list.forEach(x=>{let b=document.createElement('button');b.className='sample';b.textContent=x.name;b.onclick=()=>request('/api/transcribe-sample',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x.name)});samplesEl.append(b)})}
async function refreshLists(){let [tr,mr]=await Promise.all([fetch('/api/todos',{headers:headers()}),fetch('/api/meetings',{headers:headers()})]);if(!tr.ok||!mr.ok)return;let ts=await tr.json(),ms=await mr.json(),te=$('#todos'),me=$('#meetings');te.innerHTML=ts.length?'':'<div class="empty">저장된 To-Do가 없습니다.</div>';ts.forEach(x=>{let r=document.createElement('div');r.className='todo-row';let c=document.createElement('input');c.type='checkbox';c.checked=x.completed;c.onchange=async()=>{await fetch('/api/todos/'+x.id,{method:'PATCH',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({completed:c.checked})});refreshLists()};let m=document.createElement('div');m.textContent=x.task;let meta=document.createElement('div');meta.className='todo-meta';meta.textContent='담당: '+(x.assignee||'미지정')+' · 기한: '+(x.due_date||'미정')+' · '+(x.client||x.filename);m.append(meta);r.append(c,m);te.append(r)});me.innerHTML=ms.length?'':'<div class="empty">저장된 미팅이 없습니다.</div>';ms.forEach(x=>{let r=document.createElement('div');r.className='meeting-row';let h=document.createElement('strong');h.textContent=x.recording_date+' · '+(x.client||'거래처 미상');let p=document.createElement('p');p.textContent=x.summary;r.append(h,p);me.append(r)})}
async function boot(){try{let res=await fetch('/api/config',{headers:headers()});if(res.status===401){$('#access').innerHTML='<div class="card"><h2>접근 코드</h2><div class="key-row"><input id="accessInput" type="password" placeholder="접근 코드"><button id="accessBtn">확인</button></div></div>';$('#accessBtn').onclick=()=>{accessCode=$('#accessInput').value;boot()};return}config=await res.json();$('#mode').textContent='현재 모드: '+(config.engine==='openai'?'웹 · OpenAI API':'내 PC · faster-whisper');if(config.database_configured===false)$('#notice').innerHTML='<div class="notice">DB 미설정 — 결과만 표시</div>';if(config.engine==='openai'&&!config.server_key_configured){let saved=localStorage.getItem('stt-openai-key')||'';apiKey=saved;$('#keybox').innerHTML='<div class="card"><div class="key-row"><input id="keyInput" type="password" placeholder="OpenAI API 키 (이 브라우저에만 저장)" value=""><button id="keyBtn">키 저장</button></div><div class="hint">키는 요청마다 전송되며 서버·로그·응답에 저장되지 않습니다.</div></div>';$('#keyInput').value=saved?'저장된 키 사용 중':'';$('#keyBtn').onclick=()=>{let v=prompt('OpenAI API 키를 입력하세요.');if(v){localStorage.setItem('stt-openai-key',v);apiKey=v;$('#keyInput').value='저장된 키 사용 중'}}}else if(config.engine==='openai')$('#keybox').innerHTML='<div class="hint" style="margin-bottom:12px">서버 OpenAI 키 사용 중</div>';await loadSamples();await refreshLists()}catch(e){statusEl.textContent='설정을 불러오지 못했습니다: '+e.message}}
boot();
</script></body></html>
